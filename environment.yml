# Conda environment for PRISM Data Wrangler.
# Everything comes from conda-forge so GDAL, PROJ, rasterio and netCDF4 are built against each other.
#   conda env create -f environment.yml
#   conda activate prism-data-wrangler
name: prism-data-wrangler
channels:
  - conda-forge
dependencies:
  - python=3.12
  - requests>=2.31
  - truststore>=0.9
  - numpy>=1.24
  - rasterio>=1.3
  - geopandas>=0.14
  - pyproj
  - xarray>=2023.1
  - netcdf4>=1.6
  - pytest>=7
