# Conda environment for PRISM Data Wrangler.
# Everything comes from conda-forge so GDAL, PROJ, rasterio and netCDF4 are built against each other.
#   conda env create -f environment.yml
#   conda activate prism-data-wrangler
name: prism-data-wrangler
channels:
  - conda-forge
dependencies:
  - python=3.12
  - requests>=2.31
  - truststore>=0.9
  - numpy>=2.0
  - pandas>=2.0
  - rasterio>=1.4
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - xarray>=2023.1
  - netcdf4>=1.6
  - pytest>=7
