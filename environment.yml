# Conda environment for PRISM Storm Analysis.
# Everything comes from conda-forge so GDAL, PROJ, rasterio and netCDF4 are built against each other.
#   conda env create -f environment.yml
#   conda activate prism-storm-analysis
name: prism-storm-analysis
channels:
  - conda-forge
dependencies:
  - python=3.12   # has tomllib for storm.toml (requirements.txt adds tomli for 3.10)
  - requests>=2.31
  - truststore>=0.9
  - numpy>=2.0
  - pandas>=2.0
  - rasterio>=1.4
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - xarray>=2023.1
  - netcdf4>=1.6
  - pytest>=7
